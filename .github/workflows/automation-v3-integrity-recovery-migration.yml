name: Automation V3 Integrity Recovery Migration
on:
  push:
    branches:
      - fix/automation-v3-integrity-recovery
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automation-v3-integrity-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow integrity recovery patch
        run: python patch_v3_integrity_recovery.py
      - name: Commit source migration
        run: |
          git config user.name "Botstrader Automation V3"
          git config user.email "automation-v3@users.noreply.github.com"
          git add autonomous_asset_optimizer.py automation_v3_remote_worker.py
          git diff --cached --check
          git commit -m "Add structured V3 integrity recovery"
          git push origin HEAD:fix/automation-v3-integrity-recovery
