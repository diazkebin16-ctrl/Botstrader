name: Apply Phase1 Population Architecture Patch

on:
  push:
    branches:
      - fix/automation-v3-phase1-population-architecture
    paths:
      - apply_phase1_population_architecture.py
      - .phase1-population-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/automation-v3-phase1-population-architecture
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic patch
        run: |
          python apply_phase1_population_architecture.py
          git checkout -- .github/workflows/automation-v3-remote-runner-ci.yml
      - name: Verify patch formatting
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "diazkebin16-ctrl"
          git config user.email "diazkebin16@gmail.com"
          git add historical_replay.py research_pipeline.py research_phase2.py research_manager.py autonomous_asset_optimizer.py test_research_pipeline.py test_phase1_population_architecture.py
          git commit -m "Correct Phase 1 research population architecture"
          git push origin HEAD:fix/automation-v3-phase1-population-architecture
