name: Automation V3 Remote Runner CI

on:
  push:
    branches:
      - feature/automation-v3-remote-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-research.txt
          pip install pytest pyflakes

      - name: Focused candidate contract tests
        run: python -m pytest -q test_automation_v3_candidate_mapping.py

      - name: Remote runner tests
        run: python -m pytest -q test_automation_v3_remote_runner.py

      - name: Existing Automation V3 tests
        run: python -m pytest -q test_automation_v3.py test_research_governance.py

      - name: Relevant Automation V2 tests
        run: python -m pytest -q test_cascade_optimizer.py test_research_manager.py test_research_phase2.py test_research_integrity.py test_research_pipeline.py test_replay_validation.py test_forward_paper_release.py

      - name: Full regression
        run: python -m pytest -q

      - name: Compileall
        run: python -m compileall -q .

      - name: Pyflakes changed Python files
        run: |
          pyflakes automation_v3_candidate_mapping.py managed_strategy_rules.py automation_v3_code_change_adapter.py automation_v3_release.py automation_v3_railway_adapter.py automation_v3_remote_worker.py autonomous_asset_optimizer.py test_automation_v3_candidate_mapping.py test_automation_v3_remote_runner.py

      - name: Git diff check
        run: git diff --check 04bebbb15d43fe4f81b9309f263f5d9db6267887 HEAD

      - name: Protected file verification
        shell: bash
        run: |
          test -z "$(git diff --name-only 04bebbb15d43fe4f81b9309f263f5d9db6267887 HEAD -- forward_experiment.py)"
          patch="$(git diff --unified=0 04bebbb15d43fe4f81b9309f263f5d9db6267887 HEAD -- server.py)"
          test -n "$patch"
          printf '%s\n' "$patch" | grep -q 'managed_strategy_rules'
          printf '%s\n' "$patch" | grep -q 'evaluate_managed_strategy_rules'
          ! printf '%s\n' "$patch" | grep -q 'api-fxtrade.oanda.com'
          ! printf '%s\n' "$patch" | grep -q 'PRODUCTION_AUTHORIZED'

      - name: Secret and dataset policy scan
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess

          changed = [
              pathlib.Path(line.strip())
              for line in subprocess.check_output(
                  ['git','diff','--name-only','04bebbb15d43fe4f81b9309f263f5d9db6267887','HEAD'],
                  text=True,
              ).splitlines()
              if line.strip()
          ]
          secret_assignment = re.compile(
              r"(?im)^\s*(?:OANDA_TOKEN|RAILWAY_TOKEN|API_KEY|SECRET_KEY|PASSWORD)\s*=\s*['\"]([^'\"]+)['\"]"
          )
          placeholders = {'railway-secret','supersecret','x','y','g','r','o'}
          for path in changed:
              if not path.is_file():
                  continue
              if path.suffix.lower() in {'.db','.sqlite','.zip','.pyc'} or '__pycache__' in path.parts:
                  raise AssertionError(f'dataset/binary/transient committed: {path}')
              if path.suffix.lower() in {'.py','.yml','.yaml','.md'}:
                  text = path.read_text(encoding='utf-8')
                  for match in secret_assignment.finditer(text):
                      value = match.group(1)
                      if value not in placeholders and len(value) >= 8:
                          raise AssertionError(f'credential-like literal in {path}')
          PY
