name: Automation V3 Remote Runner CI

on:
  push:
    branches:
      - feature/automation-v3-remote-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-research.txt
          pip install pytest pyflakes

      - name: Focused remote runner tests
        run: python -m pytest -q test_automation_v3_remote_runner.py

      - name: Existing Automation V3 tests
        run: python -m pytest -q test_automation_v3.py test_research_governance.py

      - name: Relevant Automation V2 tests
        run: python -m pytest -q test_cascade_optimizer.py test_research_manager.py test_research_phase2.py test_research_integrity.py test_research_pipeline.py test_replay_validation.py test_forward_paper_release.py

      - name: Full regression
        run: python -m pytest -q

      - name: Compileall
        run: python -m compileall -q .

      - name: Pyflakes changed Python files
        run: |
          pyflakes automation_v3_code_change_adapter.py automation_v3_railway_adapter.py automation_v3_remote_worker.py test_automation_v3_remote_runner.py

      - name: Git diff check
        run: git diff --check 04bebbb15d43fe4f81b9309f263f5d9db6267887 HEAD

      - name: Protected file verification
        run: |
          changed="$(git diff --name-only 04bebbb15d43fe4f81b9309f263f5d9db6267887 HEAD)"
          ! printf '%s\n' "$changed" | grep -qx 'server.py'
          ! printf '%s\n' "$changed" | grep -qx 'forward_experiment.py'

      - name: Secret and dataset policy scan
        run: |
          python - <<'PY'
          import pathlib
          files = [
              pathlib.Path('automation_v3_code_change_adapter.py'),
              pathlib.Path('automation_v3_railway_adapter.py'),
              pathlib.Path('automation_v3_remote_worker.py'),
              pathlib.Path('.github/workflows/automation-v3-remote.yml'),
          ]
          forbidden_values = ('api-fxtrade.oanda.com', 'PRIMARY_OANDA_ENV=live', 'TRADING_ENVIRONMENT=PRODUCTION')
          for path in files:
              text = path.read_text(encoding='utf-8')
              for value in forbidden_values:
                  assert value not in text, f'{value} found in {path}'
          for path in pathlib.Path('.').rglob('*'):
              if path.is_file() and path.suffix.lower() in {'.db','.sqlite','.zip'}:
                  if str(path).startswith('.git/'):
                      continue
                  raise AssertionError(f'dataset/binary committed: {path}')
          PY
