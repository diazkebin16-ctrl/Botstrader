name: Automation V3 Remote Runner CI

on:
  push:
    branches:
      - feature/automation-v3-remote-runner
      - fix/automation-v3-integrity-recovery
      - fix/automation-v3-sha-horizon
      - fix/automation-v3-discovery-expansion
      - fix/automation-v3-phase1-continuation
      - fix/automation-v3-discovery-pregate-diagnostic
      - fix/automation-v3-phase1-population-architecture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-research.txt
          pip install pytest pyflakes

      - name: Focused candidate contract tests
        run: python -m pytest -q test_automation_v3_candidate_mapping.py

      - name: Focused integrity recovery tests
        run: python -m pytest -q test_automation_v3_integrity_recovery.py

      - name: Focused SHA horizon acceptance tests
        run: python -m pytest -q test_automation_v3_sha_horizon.py

      - name: Focused discovery expansion tests
        run: python -m pytest -q test_automation_v3_discovery_expansion.py

      - name: Focused Phase 1 continuation tests
        run: python -m pytest -q test_automation_v3_phase1_continuation.py

      - name: Focused discovery pre-gate diagnostic tests
        run: python -m pytest -q test_automation_v3_discovery_pregate.py

      - name: Focused Phase 1 population architecture tests
        run: python -m pytest -q test_phase1_population_architecture.py

      - name: Focused operational-time outcome tests
        run: python -m pytest -q test_operational_time_outcome.py test_historical_execution.py

      - name: Remote runner tests
        run: python -m pytest -q test_automation_v3_remote_runner.py

      - name: Existing Automation V3 tests
        run: python -m pytest -q test_automation_v3.py test_research_governance.py

      - name: Relevant Automation V2 tests
        run: python -m pytest -q test_cascade_optimizer.py test_research_manager.py test_research_phase2.py test_research_integrity.py test_research_pipeline.py test_replay_validation.py test_forward_paper_release.py

      - name: Full regression
        run: python -m pytest -q

      - name: Compileall
        run: python -m compileall -q .

      - name: Pyflakes changed Python files
        run: |
          pyflakes automation_v3_candidate_mapping.py managed_strategy_rules.py automation_v3_code_change_adapter.py automation_v3_release.py automation_v3_railway_adapter.py automation_v3_remote_worker.py autonomous_asset_optimizer.py automation_v3_integrity_recovery.py automation_v3_phase1_continuation.py automation_v3_discovery_pregate.py operational_time.py historical_execution.py historical_replay.py research_pipeline.py research_phase2.py research_manager.py test_automation_v3_candidate_mapping.py test_automation_v3_remote_runner.py test_automation_v3_integrity_recovery.py test_automation_v3_sha_horizon.py test_automation_v3_discovery_expansion.py test_automation_v3_phase1_continuation.py test_automation_v3_discovery_pregate.py test_phase1_population_architecture.py test_operational_time_outcome.py test_historical_execution.py test_research_pipeline.py

      - name: Git diff check
        run: |
          git diff --check 4743428e3af6c6501772d8cc77b04209fd18710f HEAD

      - name: Protected file verification
        shell: bash
        run: |
          test -z "$(git diff --name-only 4743428e3af6c6501772d8cc77b04209fd18710f HEAD -- server.py forward_experiment.py)"

      - name: Secret and dataset policy scan
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess

          changed = [
              pathlib.Path(line.strip())
              for line in subprocess.check_output(
                  ['git','diff','--name-only','4743428e3af6c6501772d8cc77b04209fd18710f','HEAD'],
                  text=True,
              ).splitlines()
              if line.strip()
          ]
          secret_assignment = re.compile(
              r"(?im)^\s*(?:OANDA_TOKEN|RAILWAY_TOKEN|API_KEY|SECRET_KEY|PASSWORD)\s*=\s*['\"]([^'\"]+)['\"]"
          )
          placeholders = {'railway-secret','supersecret','x','y','g','r','o'}
          for path in changed:
              if not path.is_file():
                  continue
              if path.suffix.lower() in {'.db','.sqlite','.zip','.pyc'} or '__pycache__' in path.parts:
                  raise AssertionError(f'dataset/binary/transient committed: {path}')
              if path.suffix.lower() in {'.py','.yml','.yaml','.md'}:
                  text = path.read_text(encoding='utf-8')
                  for match in secret_assignment.finditer(text):
                      value = match.group(1)
                      if value not in placeholders and len(value) >= 8:
                          raise AssertionError(f'credential-like literal in {path}')
          PY
