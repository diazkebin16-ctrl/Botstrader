name: Temporary incumbent fixture compatibility
on:
  push:
    branches: [fix/automation-v3-incumbent-challenger]
permissions:
  contents: write
jobs:
  patch:
    if: "github.event.head_commit.message != 'Bind candidate fixtures to incumbent'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automation-v3-incumbent-challenger
          fetch-depth: 0
      - name: Update governed candidate fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('test_automation_v3_candidate_mapping.py')
          text=p.read_text(encoding='utf-8')
          old='''    definition_sha = mapping.canonical_sha256(definition)\n    identity = {"instrument": instrument, "code_sha": SHA, "data_sha256": "d" * 64}\n'''
          new='''    definition_sha = mapping.canonical_sha256(definition)\n    incumbent_sha = "e" * 64\n    identity = {"instrument": instrument, "code_sha": SHA, "data_sha256": "d" * 64}\n'''
          if old not in text: raise SystemExit('fixture identity anchor missing')
          text=text.replace(old,new,1)
          old='''        "candidate_definition_sha256":definition_sha, "dataset_identity":identity, "code_sha":SHA,\n        "target_population_sha256":_sha(target), "phase2_sha256":_sha(phase2), "discovery_sha256":_sha(discovery)})\n'''
          new='''        "candidate_definition_sha256":definition_sha, "incumbent_definition_sha256":incumbent_sha, "dataset_identity":identity, "code_sha":SHA,\n        "target_population_sha256":_sha(target), "phase2_sha256":_sha(phase2), "discovery_sha256":_sha(discovery)})\n'''
          if old not in text: raise SystemExit('freeze anchor missing')
          text=text.replace(old,new,1)
          old='''        "input_sha256":_sha(target), "phase2_sha256":_sha(phase2), "freeze_sha256":_sha(freeze),\n        "candidate_definition_sha256":definition_sha})\n'''
          new='''        "input_sha256":_sha(target), "phase2_sha256":_sha(phase2), "freeze_sha256":_sha(freeze),\n        "candidate_definition_sha256":definition_sha, "incumbent_definition_sha256":incumbent_sha,\n        "incumbent_comparison":{"challenger_beats_incumbent":True,"material_improvement":True},\n        "relative_improvement":True, "paper_release_policy":"STANDARD_PAPER_CANDIDATE"})\n'''
          if old not in text: raise SystemExit('holdout anchor missing')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          p=Path('test_automation_v3_incumbent_challenger.py')
          text=p.read_text(encoding='utf-8')
          addition='''\n\ndef test_gbpusd_run_33933709146_relative_audit_fixture():\n    incumbent=m(-0.2554050843431774,0.6513758492645462,0.34782608695652173,46)\n    challenger=m(-0.14914944365755894,0.7826555083542742,0.39035087719298245,456)\n    comparison=compare_metrics(incumbent=incumbent,challenger=challenger,evaluation_population_sha256='9'*64)\n    assert comparison['expectancy_delta_vs_incumbent']==pytest.approx(0.10625564068561846)\n    assert comparison['profit_factor_delta_vs_incumbent']==pytest.approx(0.131279659089728)\n    assert comparison['challenger_beats_incumbent'] is True\n    discovery=compare_metrics(incumbent=m(-0.21996462264162758,0.6932061155193046,.3625,160),challenger=m(-0.13358187735146465,0.803041,.3967007,1273),evaluation_population_sha256='8'*64)\n    gate_result=decision_gate({'entry_time_only':True},analysis(-.13358187735146465,.803041),analysis(-.14914944365755894,.7826555083542742),{'severity':'MEDIUM'},min_resolved=10,discovery_comparison=discovery,validation_comparison=comparison,directional={'stable':False},temporal={'stable':True},sensitivity_result={'classification':'STABLE','all_positive':True},walk_forward={'status':'PASS'})\n    assert gate_result['decision']=='REJECT'\n    assert gate_result['diagnostic_state']=='CHALLENGER_BETTER_BUT_NOT_ROBUST'\n    assert gate_result['production_authority'] is False\n'''
          if 'test_gbpusd_run_33933709146_relative_audit_fixture' not in text:
              text += addition
          p.write_text(text,encoding='utf-8')
          PY
          git config user.name "Botstrader Automation V3"
          git config user.email "automation-v3@users.noreply.github.com"
          git add test_automation_v3_candidate_mapping.py test_automation_v3_incumbent_challenger.py
          git diff --cached --check
          git commit -m "Bind candidate fixtures to incumbent"
          git push origin HEAD:fix/automation-v3-incumbent-challenger
