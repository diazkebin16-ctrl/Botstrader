name: Temporary V3 incumbent fixture compatibility
on:
  push:
    branches: [fix/automation-v3-incumbent-challenger]
permissions:
  contents: write
jobs:
  patch:
    if: "github.event.head_commit.message != 'Bind V3 release fixtures to incumbent'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automation-v3-incumbent-challenger
          fetch-depth: 0
      - name: Update V3 release fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('test_automation_v3.py'); text=p.read_text(encoding='utf-8')
          old='''    dsha=canonical_sha256(definition);identity={"instrument":"AUD_USD","code_sha":base,"data_sha256":"d"*64}\n'''
          new='''    dsha=canonical_sha256(definition);incumbent_sha="e"*64;identity={"instrument":"AUD_USD","code_sha":base,"data_sha256":"d"*64}\n'''
          if old not in text: raise SystemExit('identity anchor missing')
          text=text.replace(old,new,1)
          old='''    freeze=write('09_freeze.json',{"status":"OK","freeze_status":"FROZEN_IMMUTABLE","immutable":True,"holdout_opened":False,"instrument":"AUD_USD","candidate_id":"candidate-1","candidate_definition":definition,"candidate_definition_sha256":dsha,"dataset_identity":identity,"code_sha":base,"target_population_sha256":sha(target),"phase2_sha256":sha(phase2),"discovery_sha256":sha(discovery)})\n'''
          new='''    freeze=write('09_freeze.json',{"status":"OK","freeze_status":"FROZEN_IMMUTABLE","immutable":True,"holdout_opened":False,"instrument":"AUD_USD","candidate_id":"candidate-1","candidate_definition":definition,"candidate_definition_sha256":dsha,"incumbent_definition_sha256":incumbent_sha,"dataset_identity":identity,"code_sha":base,"target_population_sha256":sha(target),"phase2_sha256":sha(phase2),"discovery_sha256":sha(discovery)})\n'''
          if old not in text: raise SystemExit('freeze anchor missing')
          text=text.replace(old,new,1)
          old='''    write('10_holdout.json',{"status":"PASS","stage":"holdout","instrument":"AUD_USD","decision":"RESEARCH_CANDIDATE_SURVIVED_HOLDOUT","retuning_after_holdout":False,"holdout_opened_once":True,"input_sha256":sha(target),"phase2_sha256":sha(phase2),"freeze_sha256":sha(freeze),"candidate_definition_sha256":dsha})\n'''
          new='''    write('10_holdout.json',{"status":"PASS","stage":"holdout","instrument":"AUD_USD","decision":"RESEARCH_CANDIDATE_SURVIVED_HOLDOUT","retuning_after_holdout":False,"holdout_opened_once":True,"input_sha256":sha(target),"phase2_sha256":sha(phase2),"freeze_sha256":sha(freeze),"candidate_definition_sha256":dsha,"incumbent_definition_sha256":incumbent_sha,"incumbent_comparison":{"challenger_beats_incumbent":True,"material_improvement":True},"relative_improvement":True,"paper_release_policy":"STANDARD_PAPER_CANDIDATE"})\n'''
          if old not in text: raise SystemExit('holdout anchor missing')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          git config user.name "Botstrader Automation V3"
          git config user.email "automation-v3@users.noreply.github.com"
          git add test_automation_v3.py
          git diff --cached --check
          git commit -m "Bind V3 release fixtures to incumbent"
          git push origin HEAD:fix/automation-v3-incumbent-challenger
