name: Temporary horizon max3 patch
on:
  push:
    branches: [fix/automation-v3-horizon-max3-lookback]
permissions:
  contents: write
jobs:
  patch:
    if: "github.event.head_commit.message != 'Apply horizon and max3 lookback fix'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automation-v3-horizon-max3-lookback
          fetch-depth: 0
      - name: Apply source and regression patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old[:100]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          # Automation V3: recent-only lookback and market-aware research end.
          replace(
              'autonomous_asset_optimizer.py',
              'from datetime import datetime,timedelta,timezone\n',
              'from datetime import datetime,timedelta,timezone\nfrom zoneinfo import ZoneInfo\n',
          )
          replace(
              'autonomous_asset_optimizer.py',
              'LOOKBACK_SEQUENCE=(1,3,6,12);MAX_RESEARCH_LOOKBACK_MONTHS=12',
              'LOOKBACK_SEQUENCE=(1,2,3);MAX_RESEARCH_LOOKBACK_MONTHS=3',
          )
          replace(
              'autonomous_asset_optimizer.py',
              '''def utc_now():return datetime.now(timezone.utc).isoformat().replace("+00:00","Z")\ndef aligned_research_end(now,horizon_minutes=240):\n d=now.astimezone(timezone.utc)-timedelta(minutes=int(horizon_minutes));return d.replace(minute=0,second=0,microsecond=0)\n''',
              '''def utc_now():return datetime.now(timezone.utc).isoformat().replace("+00:00","Z")\nNY_TZ=ZoneInfo("America/New_York")\ndef _fx_market_open(moment):\n et=moment.astimezone(NY_TZ);weekday=et.weekday()\n if weekday==5:return False\n if weekday==6:return et.hour>=17\n if weekday==4:return et.hour<17\n return True\ndef _previous_friday_close(moment):\n et=moment.astimezone(NY_TZ);days=(et.weekday()-4)%7;candidate=et-timedelta(days=days)\n candidate=candidate.replace(hour=17,minute=0,second=0,microsecond=0)\n if candidate>et:candidate-=timedelta(days=7)\n return candidate.astimezone(timezone.utc)\ndef _interval_is_fx_open(start,end):\n if start>=end:return False\n cursor=start\n while cursor<end:\n  if not _fx_market_open(cursor):return False\n  cursor+=timedelta(minutes=30)\n return _fx_market_open(end-timedelta(microseconds=1))\ndef aligned_research_end(now,horizon_minutes=240):\n boundary=now.astimezone(timezone.utc).replace(minute=0,second=0,microsecond=0);horizon=timedelta(minutes=int(horizon_minutes));candidate=boundary-horizon\n if not _interval_is_fx_open(candidate,boundary):\n  boundary=_previous_friday_close(boundary);candidate=boundary-horizon\n if not _interval_is_fx_open(candidate,boundary):raise ValueError("unable to place research horizon inside tradable FX session")\n return candidate\n''',
          )
          replace(
              'autonomous_asset_optimizer.py',
              'max_lookback_months=12',
              'max_lookback_months=MAX_RESEARCH_LOOKBACK_MONTHS',
          )
          replace(
              'autonomous_asset_optimizer.py',
              '''      if err and isinstance(diag,Mapping) and diag.get("recoverable") is True:\n       if months==12:return self._terminal(ledger,i,"DATA_COVERAGE_INSUFFICIENT","recoverable data coverage exhausted maximum lookback",lookback_months=months,integrity_diagnostic=diag)\n       ledger.append(i,"decision_history",{"decision":"EXPAND_LOOKBACK","months":months,"recommended_action":"EXPAND_LOOKBACK","at":utc_now()});continue\n''',
              '''      if err and isinstance(diag,Mapping) and diag.get("recoverable") is True:\n       return self._terminal(ledger,i,"DATA_COVERAGE_INSUFFICIENT","recoverable data coverage remains incomplete after same-lookback reacquire",lookback_months=months,integrity_diagnostic=diag)\n''',
          )
          replace(
              'autonomous_asset_optimizer.py',
              'if months==12:return self._terminal(ledger,i,"INSUFFICIENT_EVIDENCE","maximum lookback exhausted",diagnostic=diag,pre_gate_diagnostic=pre_gate)',
              'if months==MAX_RESEARCH_LOOKBACK_MONTHS:return self._terminal(ledger,i,"INSUFFICIENT_EVIDENCE","maximum 3-month lookback exhausted",lookback_months=months,diagnostic=diag,pre_gate_diagnostic=pre_gate)',
          )

          # Integrity diagnostics: same-lookback recovery only; never use backward lookback for forward horizon.
          replace(
              'automation_v3_integrity_recovery.py',
              '''    if recoverable:\n        recommended = "REACQUIRE_SAME_LOOKBACK" if retry_count == 0 else "EXPAND_LOOKBACK"\n    else:\n        recommended = "HARD_BLOCK"\n''',
              '''    if recoverable:\n        recommended = "REACQUIRE_SAME_LOOKBACK" if retry_count == 0 else "DATA_COVERAGE_INSUFFICIENT"\n    else:\n        recommended = "HARD_BLOCK"\n''',
          )
          replace(
              'automation_v3_integrity_recovery.py',
              '''    coverage_starts = [str(frame.get("first")) for frame in timeframes.values() if isinstance(frame, Mapping) and frame.get("first")]\n    coverage_ends = [str(frame.get("last")) for frame in timeframes.values() if isinstance(frame, Mapping) and frame.get("last")]\n''',
              '''    coverage_starts = [str(frame.get("first")) for frame in timeframes.values() if isinstance(frame, Mapping) and frame.get("first")]\n    coverage_ends = [str(frame.get("coverage_end")) for frame in timeframes.values() if isinstance(frame, Mapping) and frame.get("coverage_end")]\n''',
          )
          replace(
              'automation_v3_integrity_recovery.py',
              '''        "coverage_end": max(coverage_ends) if coverage_ends else None,\n        "requested_start": requested_start,\n        "requested_end": requested_end,\n''',
              '''        "coverage_end": min(coverage_ends) if coverage_ends else None,\n        "requested_start": requested_start,\n        "requested_end": requested_end,\n        "required_horizon_end": report.get("required_horizon_end"),\n''',
          )

          # Explicit candle-open -> completed-candle-end semantics in integrity evidence.
          replace(
              'research_integrity.py',
              '''        "last": timestamps[-1].isoformat() if timestamps else None,\n        "strictly_ordered": ordered,\n''',
              '''        "last": timestamps[-1].isoformat() if timestamps else None,\n        "coverage_end": (timestamps[-1] + timedelta(seconds=expected)).isoformat() if timestamps else None,\n        "strictly_ordered": ordered,\n''',
          )
          replace(
              'research_integrity.py',
              '''        first = _dt(frame["first"]) if frame.get("first") else None\n        last = _dt(frame["last"]) if frame.get("last") else None\n        tolerance = timedelta(seconds=TIMEFRAME_SECONDS[timeframe])\n        starts_early = first is not None and first <= required_start + tolerance\n        ends_late = last is not None and last + tolerance >= required_end\n        coverage[timeframe] = {"warmup_covered": starts_early, "horizon_covered": ends_late}\n''',
              '''        first = _dt(frame["first"]) if frame.get("first") else None\n        complete_end = _dt(frame["coverage_end"]) if frame.get("coverage_end") else None\n        tolerance = timedelta(seconds=TIMEFRAME_SECONDS[timeframe])\n        starts_early = first is not None and first <= required_start + tolerance\n        ends_late = complete_end is not None and complete_end >= required_end\n        coverage[timeframe] = {"warmup_covered": starts_early, "horizon_covered": ends_late, "actual_complete_end": complete_end.isoformat() if complete_end else None, "required_horizon_end": required_end.isoformat()}\n''',
          )
          replace(
              'research_integrity.py',
              '''        "horizon_minutes": int(horizon_minutes),\n        "input_sha256": data_sha,\n''',
              '''        "horizon_minutes": int(horizon_minutes),\n        "research_end": end_dt.isoformat(),\n        "required_horizon_end": required_end.isoformat(),\n        "input_sha256": data_sha,\n''',
          )

          # Existing V3 tests: product policy is now 1 -> 2 -> 3 only.
          replace('test_automation_v3.py', 'def test_auto_expands_one_to_three_months', 'def test_auto_expands_one_to_two_months')
          replace('test_automation_v3.py', '{1:"insufficient",3:"ok"}', '{1:"insufficient",2:"ok"}')
          replace('test_automation_v3.py', 'def test_auto_expands_three_to_six_months', 'def test_auto_expands_two_to_three_months')
          replace('test_automation_v3.py', '{1:"insufficient",3:"insufficient",6:"ok"}', '{1:"insufficient",2:"insufficient",3:"ok"}')
          replace(
              'test_automation_v3.py',
              '''def test_auto_expands_six_to_twelve_months(tmp_path,monkeypatch):\n    monkeypatch.setenv("BOTS_RESEARCH_ROOT",str(tmp_path/"research"));opt,data,_=_optimizer(tmp_path,{1:"insufficient",3:"insufficient",6:"insufficient",12:"ok"})\n    assert opt.optimize("AUD_USD")["status"]=="PAPER_DEPLOYED"; assert len(data.calls)==4\n\ndef test_twelve_months_insufficient_terminal(tmp_path,monkeypatch):\n    monkeypatch.setenv("BOTS_RESEARCH_ROOT",str(tmp_path/"research"));opt,data,_=_optimizer(tmp_path,{1:"insufficient",3:"insufficient",6:"insufficient",12:"insufficient"})\n    assert opt.optimize("AUD_USD")["status"]=="INSUFFICIENT_EVIDENCE" and len(data.calls)==4\n''',
              '''def test_three_months_insufficient_terminal(tmp_path,monkeypatch):\n    monkeypatch.setenv("BOTS_RESEARCH_ROOT",str(tmp_path/"research"));opt,data,_=_optimizer(tmp_path,{1:"insufficient",2:"insufficient",3:"insufficient"})\n    assert opt.optimize("AUD_USD")["status"]=="INSUFFICIENT_EVIDENCE" and len(data.calls)==3\n''',
          )

          # Discovery expansion regression expectations.
          replace('test_automation_v3_discovery_expansion.py', 'def test_discovery_insufficient_support_one_to_three', 'def test_discovery_insufficient_support_one_to_two')
          replace('test_automation_v3_discovery_expansion.py', '{1: "insufficient", 3: "bad"}', '{1: "insufficient", 2: "bad"}')
          replace('test_automation_v3_discovery_expansion.py', 'def test_discovery_insufficient_support_three_to_six', 'def test_discovery_insufficient_support_two_to_three')
          replace('test_automation_v3_discovery_expansion.py', '{1: "insufficient", 3: "insufficient", 6: "bad"}', '{1: "insufficient", 2: "insufficient", 3: "bad"}')
          replace(
              'test_automation_v3_discovery_expansion.py',
              '''def test_discovery_insufficient_support_six_to_twelve(tmp_path, monkeypatch):\n    monkeypatch.setenv("BOTS_RESEARCH_ROOT", str(tmp_path / "research"))\n    opt, data, _ = _pass_integrity_optimizer(tmp_path, {1: "insufficient", 3: "insufficient", 6: "insufficient", 12: "bad"})\n    assert opt.optimize("AUD_USD")["status"] == "NO_VALID_CANDIDATE"\n    assert len(data.calls) == 4\n\n\ndef test_discovery_twelve_month_insufficient_is_insufficient_evidence(tmp_path, monkeypatch):\n    monkeypatch.setenv("BOTS_RESEARCH_ROOT", str(tmp_path / "research"))\n    opt, data, _ = _pass_integrity_optimizer(tmp_path, {1: "insufficient", 3: "insufficient", 6: "insufficient", 12: "insufficient"})\n    assert opt.optimize("AUD_USD")["status"] == "INSUFFICIENT_EVIDENCE"\n    assert len(data.calls) == 4\n''',
              '''def test_discovery_three_month_insufficient_is_insufficient_evidence(tmp_path, monkeypatch):\n    monkeypatch.setenv("BOTS_RESEARCH_ROOT", str(tmp_path / "research"))\n    opt, data, _ = _pass_integrity_optimizer(tmp_path, {1: "insufficient", 2: "insufficient", 3: "insufficient"})\n    assert opt.optimize("AUD_USD")["status"] == "INSUFFICIENT_EVIDENCE"\n    assert len(data.calls) == 3\n''',
          )

          # Integrity recovery no longer expands lookback backward for coverage failures.
          replace(
              'test_automation_v3_integrity_recovery.py',
              '''def test_repeated_recoverable_failure_expands_lookback(tmp_path, monkeypatch):\n    out, data, _, calls = _run(tmp_path, monkeypatch, {1: ["coverage", "coverage"], 3: [None]})\n    assert out["status"] == "PAPER_DEPLOYED" and calls[1] == 2 and calls[3] == 1 and len(data.calls) == 3\n\n\ndef test_twelve_month_repeated_coverage_has_safe_terminal(tmp_path, monkeypatch):\n    out, data, _, calls = _run(tmp_path, monkeypatch, {\n        1: ["coverage", "coverage"], 3: ["coverage", "coverage"],\n        6: ["coverage", "coverage"], 12: ["coverage", "coverage"],\n    })\n    assert out["status"] == "DATA_COVERAGE_INSUFFICIENT" and calls[12] == 2 and len(data.calls) == 8\n    assert out["production_authority"] is False\n''',
              '''def test_repeated_recoverable_failure_stops_same_lookback(tmp_path, monkeypatch):\n    out, data, _, calls = _run(tmp_path, monkeypatch, {1: ["coverage", "coverage"]})\n    assert out["status"] == "DATA_COVERAGE_INSUFFICIENT" and calls[1] == 2 and len(data.calls) == 2\n    assert set(calls) == {1}\n    assert out["production_authority"] is False\n''',
          )
          replace(
              'test_automation_v3_integrity_recovery.py',
              'diagnostic = {"failed_checks": ["M1_HORIZON_COVERAGE_INCOMPLETE"], "recommended_action": "EXPAND_LOOKBACK", "production_authority": False}',
              'diagnostic = {"failed_checks": ["M1_HORIZON_COVERAGE_INCOMPLETE"], "recommended_action": "DATA_COVERAGE_INSUFFICIENT", "production_authority": False}',
          )
          replace(
              'test_automation_v3_integrity_recovery.py',
              '"lookback_attempts": [{"months": 12}]',
              '"lookback_attempts": [{"months": 3}]',
          )
          replace(
              'test_automation_v3_integrity_recovery.py',
              'assert snap["integrity_diagnostic"]["recommended_action"] == "EXPAND_LOOKBACK"',
              'assert snap["integrity_diagnostic"]["recommended_action"] == "DATA_COVERAGE_INSUFFICIENT"',
          )

          Path('test_automation_v3_horizon_max3_lookback.py').write_text('''from datetime import datetime, timedelta, timezone\nimport json\n\nfrom autonomous_asset_optimizer import (\n    LOOKBACK_SEQUENCE, MAX_RESEARCH_LOOKBACK_MONTHS, aligned_research_end,\n)\nfrom automation_v3_integrity_recovery import build_integrity_diagnostic\nfrom research_integrity import TIMEFRAME_SECONDS, validate_dataset\n\n\ndef _rows(tf, first, last_open):\n    step = timedelta(seconds=TIMEFRAME_SECONDS[tf])\n    out=[]; cur=first\n    while cur <= last_open:\n        row={"t":cur.isoformat(),"o":1.0,"h":1.1,"l":0.9,"c":1.0}\n        if tf == "M1":\n            row.update({"bid_o":1.0,"bid_h":1.1,"bid_l":0.9,"bid_c":1.0,"ask_o":1.01,"ask_h":1.11,"ask_l":0.91,"ask_c":1.01})\n        out.append(row);cur+=step\n    return out\n\n\ndef _bundle(first, ends):\n    return {tf:_rows(tf,first,ends[tf]) for tf in TIMEFRAME_SECONDS}\n\n\ndef _validate(tmp_path, end, ends):\n    first=end-timedelta(days=11)\n    cache=tmp_path/"cache.json";cache.write_text(json.dumps(_bundle(first,ends)),encoding="utf-8")\n    return validate_dataset(str(cache),instrument="AUD_USD",start=(end-timedelta(days=1)).isoformat(),end=end.isoformat(),warmup_days=10,horizon_minutes=240,repo=tmp_path)\n\n\ndef test_run_33925240916_shape_is_strictly_incomplete(tmp_path, monkeypatch):\n    monkeypatch.setattr('research_integrity._git_head', lambda repo:'a'*40)\n    end=datetime(2026,9,4,18,0,tzinfo=timezone.utc)\n    ends={"H1":datetime(2026,9,4,20,0,tzinfo=timezone.utc),"M15":datetime(2026,9,4,20,45,tzinfo=timezone.utc),"M5":datetime(2026,9,4,20,55,tzinfo=timezone.utc),"M1":datetime(2026,9,4,20,59,tzinfo=timezone.utc)}\n    out=_validate(tmp_path,end,ends)\n    assert out["required_horizon_end"]=="2026-09-04T22:00:00+00:00"\n    assert set(out["failures"]) >= {f"{tf}_HORIZON_COVERAGE_INCOMPLETE" for tf in TIMEFRAME_SECONDS}\n    assert all(v["actual_complete_end"]=="2026-09-04T21:00:00+00:00" for v in out["coverage"].values())\n\n\ndef test_exact_completed_candle_coverage_passes_all_timeframes(tmp_path, monkeypatch):\n    monkeypatch.setattr('research_integrity._git_head', lambda repo:'a'*40)\n    end=datetime(2026,9,4,17,0,tzinfo=timezone.utc)\n    ends={"H1":datetime(2026,9,4,20,0,tzinfo=timezone.utc),"M15":datetime(2026,9,4,20,45,tzinfo=timezone.utc),"M5":datetime(2026,9,4,20,55,tzinfo=timezone.utc),"M1":datetime(2026,9,4,20,59,tzinfo=timezone.utc)}\n    out=_validate(tmp_path,end,ends)\n    assert out["required_horizon_end"]=="2026-09-04T21:00:00+00:00"\n    assert not [x for x in out["failures"] if "HORIZON_COVERAGE_INCOMPLETE" in x]\n    assert all(v["horizon_covered"] for v in out["coverage"].values())\n\n\ndef test_one_candle_short_fails_each_timeframe(tmp_path, monkeypatch):\n    monkeypatch.setattr('research_integrity._git_head', lambda repo:'a'*40)\n    end=datetime(2026,9,4,17,0,tzinfo=timezone.utc);required=end+timedelta(minutes=240)\n    for tf,seconds in TIMEFRAME_SECONDS.items():\n        exact={"H1":datetime(2026,9,4,20,0,tzinfo=timezone.utc),"M15":datetime(2026,9,4,20,45,tzinfo=timezone.utc),"M5":datetime(2026,9,4,20,55,tzinfo=timezone.utc),"M1":datetime(2026,9,4,20,59,tzinfo=timezone.utc)}\n        exact[tf]-=timedelta(seconds=seconds)\n        out=_validate(tmp_path/ tf,end,exact)\n        assert f"{tf}_HORIZON_COVERAGE_INCOMPLETE" in out["failures"]\n        assert out["coverage"][tf]["actual_complete_end"] < required.isoformat()\n\n\ndef test_friday_alignment_avoids_impossible_weekend_horizon():\n    now=datetime(2026,9,4,22,23,tzinfo=timezone.utc)\n    assert aligned_research_end(now,240)==datetime(2026,9,4,17,0,tzinfo=timezone.utc)\n\n\ndef test_sunday_before_four_hours_of_reopen_uses_friday_window():\n    now=datetime(2026,9,6,23,0,tzinfo=timezone.utc)  # Sunday 19:00 ET, only 2h after reopen\n    assert aligned_research_end(now,240)==datetime(2026,9,4,17,0,tzinfo=timezone.utc)\n\n\ndef test_sunday_after_four_hours_of_reopen_can_use_recent_window():\n    now=datetime(2026,9,7,1,0,tzinfo=timezone.utc)  # Sunday 21:00 ET\n    assert aligned_research_end(now,240)==datetime(2026,9,6,21,0,tzinfo=timezone.utc)\n\n\ndef test_max_lookback_policy_is_explicitly_three_months():\n    assert LOOKBACK_SEQUENCE==(1,2,3)\n    assert MAX_RESEARCH_LOOKBACK_MONTHS==3\n    assert 6 not in LOOKBACK_SEQUENCE and 12 not in LOOKBACK_SEQUENCE\n\n\ndef test_retry_horizon_diagnostic_does_not_recommend_backward_expansion(tmp_path):\n    artifact=tmp_path/"01.json"\n    report={"status":"FAIL","failures":["M1_HORIZON_COVERAGE_INCOMPLETE"],"warmup_days":10,"horizon_minutes":240,"required_horizon_end":"2026-09-04T21:00:00+00:00","bid_ask_real":True,"midpoint_only":False,"gaps_present":False,"coverage":{"M1":{"warmup_covered":True,"horizon_covered":False}},"timeframes":{"M1":{"count":1,"first":"2026-09-04T20:58:00+00:00","last":"2026-09-04T20:59:00+00:00","coverage_end":"2026-09-04T21:00:00+00:00","non_weekend_gaps":0}}}\n    artifact.write_text(json.dumps(report),encoding="utf-8")\n    diag=build_integrity_diagnostic(report,artifact_path=artifact,cache_path=tmp_path/"cache.json",requested_start="2026-08-04T17:00:00+00:00",requested_end="2026-09-04T17:00:00+00:00",retry_count=1)\n    assert diag["recommended_action"]=="DATA_COVERAGE_INSUFFICIENT"\n    assert diag["required_horizon_end"]=="2026-09-04T21:00:00+00:00"\n    assert diag["production_authority"] is False\n''', encoding='utf-8')
          PY
          git config user.name 'Botstrader Automation V3'
          git config user.email 'automation-v3@users.noreply.github.com'
          git add autonomous_asset_optimizer.py automation_v3_integrity_recovery.py research_integrity.py test_automation_v3.py test_automation_v3_discovery_expansion.py test_automation_v3_integrity_recovery.py test_automation_v3_horizon_max3_lookback.py
          git diff --cached --check
          git commit -m 'Apply horizon and max3 lookback fix'
          git push origin HEAD:fix/automation-v3-horizon-max3-lookback
