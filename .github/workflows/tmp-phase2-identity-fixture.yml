name: Temporary Phase2 identity fixture update
on:
  push:
    branches: [fix/automation-v3-incumbent-challenger]
permissions:
  contents: write
jobs:
  patch:
    if: "github.event.head_commit.message != 'Adapt Phase2 provenance fixtures to stricter gate'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automation-v3-incumbent-challenger
          fetch-depth: 0
      - name: Adapt provenance-only fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('test_research_phase2.py'); text=p.read_text(encoding='utf-8')
          anchor='''def _write(path,payload):\n    path.write_text(json.dumps(payload),encoding="utf-8")\n\n\n'''
          helper='''def _write(path,payload):\n    path.write_text(json.dumps(payload),encoding="utf-8")\n\n\ndef _freezeable_fixture(discovery):\n    """Build an explicit provenance-test freeze candidate without weakening discovery gates."""\n    if discovery.get("proposed_frozen_candidate"):\n        return discovery\n    ranked=discovery.get("ranked_candidates") or []\n    assert ranked, "fixture requires at least one evaluated candidate"\n    item=dict(ranked[0])\n    item["decision_gate"]={**dict(item.get("decision_gate") or {}),"decision":"FREEZE_ELIGIBLE"}\n    out=dict(discovery);out["status"]="OK";out["proposed_frozen_candidate"]=item\n    return out\n\n\n'''
          if anchor not in text: raise SystemExit('helper anchor missing')
          text=text.replace(anchor,helper,1)
          old='''    discovery_payload = discover_candidates(str(target), str(phase2), min_resolved=5)\n    discovery = tmp_path / "discovery.json"\n    _write(discovery, discovery_payload)\n'''
          new='''    discovery_payload = _freezeable_fixture(discover_candidates(str(target), str(phase2), min_resolved=5))\n    discovery = tmp_path / "discovery.json"\n    _write(discovery, discovery_payload)\n'''
          if old not in text: raise SystemExit('holdout chain anchor missing')
          text=text.replace(old,new,1)
          old='''    discovery=discover_candidates(str(target),str(phase2_path),min_resolved=5)\n    assert discovery["status"]=="OK"\n    assert discovery["holdout_opened"] is False\n'''
          new='''    discovery=discover_candidates(str(target),str(phase2_path),min_resolved=5)\n    assert discovery["status"] in {"OK","NO_FREEZE_ELIGIBLE_CANDIDATE"}\n    assert discovery["holdout_opened"] is False\n    discovery=_freezeable_fixture(discovery)\n'''
          if old not in text: raise SystemExit('phase2 test anchor missing')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          git config user.name "Botstrader Automation V3"
          git config user.email "automation-v3@users.noreply.github.com"
          git add test_research_phase2.py
          git diff --cached --check
          git commit -m "Adapt Phase2 provenance fixtures to stricter gate"
          git push origin HEAD:fix/automation-v3-incumbent-challenger
