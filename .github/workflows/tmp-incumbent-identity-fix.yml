name: Temporary incumbent identity normalization
on:
  push:
    branches: [fix/automation-v3-incumbent-challenger]
permissions:
  contents: write
jobs:
  patch:
    if: "github.event.head_commit.message != 'Normalize incumbent methodology identity'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automation-v3-incumbent-challenger
          fetch-depth: 0
      - name: Normalize incumbent identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research_phase2.py'); text=p.read_text(encoding='utf-8')
          old='''def _incumbent_methodology(min_resolved: int) -> Dict[str, Any]:\n    return {\n        "contract":"INCUMBENT_VS_CHALLENGER_V1",\n        "min_resolved":int(min_resolved),\n        "phase2_win_retention":0.60,\n        "phase2_min_losses_rejected":2,\n        "same_partition_required":True,\n        "bid_ask_required":True,\n        "operational_schedule_fixed":True,\n        "outcome_semantics":"TP_SL_OR_1650_ET",\n    }\n'''
          new='''def _incumbent_methodology(min_resolved: int) -> Dict[str, Any]:\n    # min_resolved is intentionally NOT part of incumbent identity. It governs\n    # challenger evidence sufficiency and may vary by research/test policy, but\n    # it does not change the strategy being challenged.\n    return {\n        "contract":"INCUMBENT_VS_CHALLENGER_V1",\n        "same_partition_required":True,\n        "bid_ask_required":True,\n        "operational_schedule_fixed":True,\n        "outcome_semantics":"TP_SL_OR_1650_ET",\n    }\n'''
          if old not in text: raise SystemExit('incumbent methodology block missing')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          git config user.name "Botstrader Automation V3"
          git config user.email "automation-v3@users.noreply.github.com"
          git add research_phase2.py
          git diff --cached --check
          git commit -m "Normalize incumbent methodology identity"
          git push origin HEAD:fix/automation-v3-incumbent-challenger
