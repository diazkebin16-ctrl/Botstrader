name: tmp-v3-ledger-lookback-fix
on:
  push:
    branches:
      - fix/automation-v3-review-ledger-lookback
    paths:
      - _tmp_v3_ledger_fix.py
permissions:
  contents: write
jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/automation-v3-review-ledger-lookback
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-research.txt ]; then pip install -r requirements-research.txt; fi
          pip install pytest pyflakes
      - name: Apply focused fix and validate
        env:
          BASE_SHA: a922ce867eae361b6e326d0539f8dce5cb71e85c
        run: python _tmp_v3_ledger_fix.py
