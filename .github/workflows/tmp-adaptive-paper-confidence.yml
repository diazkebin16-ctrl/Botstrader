name: Temporary Automation V3 adaptive PAPER confidence validation
on:
  push:
    branches: [fix/automation-v3-adaptive-paper-confidence]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply governed patch
        run: |
          python .github/scripts/tmp_adaptive_paper_patch.py
          python .github/scripts/tmp_adaptive_paper_followup.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-research.txt
          pip install pytest pyflakes
      - name: Adaptive PAPER focused tests
        run: python -m pytest -q test_automation_v3_adaptive_paper_confidence.py
      - name: Incumbent challenger tests
        run: python -m pytest -q test_automation_v3_incumbent_challenger.py
      - name: Mode tests
        run: python -m pytest -q test_automation_v3_modes.py test_automation_v3_diagnostic_review_status.py
      - name: Candidate mapping and freeze holdout tests
        run: python -m pytest -q test_automation_v3_candidate_mapping.py test_research_phase2.py
      - name: V3 tests
        run: python -m pytest -q test_automation_v3.py test_research_governance.py
      - name: Remote tests
        run: python -m pytest -q test_automation_v3_remote_runner.py
      - name: Phase1 tests
        run: python -m pytest -q test_automation_v3_phase1_population_architecture.py test_automation_v3_phase1_continuation.py
      - name: Operational time tests
        run: python -m pytest -q test_operational_time_rules.py test_research_operational_time.py
      - name: V2 regression
        run: python -m pytest -q test_research_automation_v2.py test_research_automation_v2_identity_binding.py
      - name: Full regression
        run: python -m pytest -q
      - name: Compileall
        run: python -m compileall -q .
      - name: Pyflakes changed Python
        run: pyflakes research_phase2.py automation_v3_incumbent_challenger.py automation_v3_modes.py automation_v3_candidate_mapping.py autonomous_asset_optimizer.py test_automation_v3_adaptive_paper_confidence.py test_automation_v3_incumbent_challenger.py
      - name: Git diff check
        run: git diff --check 8492aaec228da5e7c5d9066a448939b11b047493 HEAD
      - name: Protected files
        run: test -z "$(git diff --name-only 8492aaec228da5e7c5d9066a448939b11b047493 HEAD -- server.py forward_experiment.py)"
      - name: Secret and data scan
        run: |
          python - <<'PY'
          import pathlib,re,subprocess
          changed=[pathlib.Path(x) for x in subprocess.check_output(['git','diff','--name-only','8492aaec228da5e7c5d9066a448939b11b047493','HEAD'],text=True).splitlines() if x.strip()]
          pat=re.compile(r'(?im)^\s*(?:OANDA_TOKEN|RAILWAY_TOKEN|API_KEY|SECRET_KEY|PASSWORD)\s*=\s*[\'\"]([^\'\"]+)[\'\"]')
          placeholders={'x','y','g','r','o','railway-secret','supersecret'}
          for p in changed:
            if not p.is_file(): continue
            if p.suffix.lower() in {'.db','.sqlite','.zip','.pyc'} or '__pycache__' in p.parts: raise AssertionError(p)
            if p.suffix.lower() in {'.py','.yml','.yaml','.md'}:
              text=p.read_text(encoding='utf-8')
              for m in pat.finditer(text):
                if m.group(1) not in placeholders and len(m.group(1))>=8: raise AssertionError(f'credential-like literal in {p}')
          PY
      - name: Commit governed implementation only
        run: |
          git config user.name "Botstrader Automation V3"
          git config user.email "automation-v3@users.noreply.github.com"
          rm -f .github/scripts/tmp_adaptive_paper_patch.py .github/scripts/tmp_adaptive_paper_followup.py .github/workflows/tmp-adaptive-paper-confidence.yml
          git add research_phase2.py automation_v3_incumbent_challenger.py automation_v3_modes.py automation_v3_candidate_mapping.py autonomous_asset_optimizer.py test_automation_v3_adaptive_paper_confidence.py test_automation_v3_incumbent_challenger.py .github/scripts/tmp_adaptive_paper_patch.py .github/scripts/tmp_adaptive_paper_followup.py .github/workflows/tmp-adaptive-paper-confidence.yml
          git diff --cached --check
          git commit -m "Add adaptive PAPER confidence policy"
          git push origin HEAD:fix/automation-v3-adaptive-paper-confidence
