name: Directional Two-Month Min-10 Research

on:
  push:
    branches:
      - research/two-month-min10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: directional-two-month-min10
  cancel-in-progress: false

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      BOTS_V3_PRODUCTION_AUTHORITY: "false"
      BOTS_V3_RAILWAY_PROJECT_ID: c19fa79a-6284-4d9d-bddc-06a62c0f998b
      BOTS_V3_RAILWAY_ENVIRONMENT_ID: 3f0906f8-56a4-471f-9c19-cea4d0a82f20
      BOTS_V3_RAILWAY_SERVICE_ID: 06f23754-3652-4817-a119-2c9851408120
      OANDA: https://api-fxpractice.oanda.com

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure isolated output path
        run: echo "DIRECTIONAL_MONTH_ROOT=$RUNNER_TEMP/directional_two_month_min10" >> "$GITHUB_ENV"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research.txt
          npm install -g @railway/cli@5.23.3

      - name: Validate optimizer
        run: python -m pytest -q test_directional_month_optimizer.py

      - name: Import PAPER credentials securely
        run: python automation_v3_railway_adapter.py export-runtime

      - name: Run isolated ten-lane optimization
        run: python run_directional_month_optimization.py

      - name: Record governed evidence
        shell: bash
        run: |
          cp "$DIRECTIONAL_MONTH_ROOT/DIRECTIONAL_MONTH_OPTIMIZATION.json" DIRECTIONAL_TWO_MONTH_MIN10_EVIDENCE.json
          git config user.name "Botstrader Research"
          git config user.email "research@users.noreply.github.com"
          git add DIRECTIONAL_TWO_MONTH_MIN10_EVIDENCE.json
          git diff --cached --check
          git commit -m "Record two-month min-10 directional evidence"
          git push origin HEAD:research/two-month-min10

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-two-month-min10-${{ github.run_id }}
          path: ${{ runner.temp }}/directional_two_month_min10/DIRECTIONAL_MONTH_OPTIMIZATION.json
          if-no-files-found: warn
          retention-days: 30
