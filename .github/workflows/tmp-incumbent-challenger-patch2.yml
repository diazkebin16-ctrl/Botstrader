name: Temporary incumbent challenger patch retry
on:
  push:
    branches: [fix/automation-v3-incumbent-challenger]
permissions:
  contents: write
jobs:
  patch:
    if: "github.event.head_commit.message != 'Apply incumbent challenger contract'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automation-v3-incumbent-challenger
          fetch-depth: 0
      - name: Apply source patch without CI workflow mutation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/tmp-incumbent-challenger-patch.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          code=src.split(marker,1)[1].split("\n          PY",1)[0]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
          code=code.split("# CI branch + focused test.",1)[0]
          exec(compile(code,'incumbent_patch','exec'),{'__name__':'__main__'})
          PY
          git config user.name "Botstrader Automation V3"
          git config user.email "automation-v3@users.noreply.github.com"
          git add automation_v3_incumbent_challenger.py research_phase2.py automation_v3_candidate_mapping.py test_automation_v3_incumbent_challenger.py
          git diff --cached --check
          git commit -m "Apply incumbent challenger contract"
          git push origin HEAD:fix/automation-v3-incumbent-challenger
