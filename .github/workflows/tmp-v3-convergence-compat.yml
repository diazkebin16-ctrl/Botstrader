name: Temporary convergence compatibility patch
on:
  push:
    branches: [fix/automation-v3-discovery-convergence-performance]
permissions:
  contents: write
jobs:
  patch:
    if: "github.event.head_commit.message != 'Patch remote worker communicate fallback'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automation-v3-discovery-convergence-performance
          fetch-depth: 0
      - name: Patch compatibility fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('automation_v3_remote_worker.py')
          s=p.read_text()
          old='''        communicate = getattr(proc, "communicate", None)\n        if callable(communicate):\n            try:\n                communicate()\n            except ValueError:\n                pass\n\n    if budget_checkpointed:\n'''
          new='''        communicated_stdout = ""\n        communicated_stderr = ""\n        communicate = getattr(proc, "communicate", None)\n        if callable(communicate):\n            try:\n                communicated = communicate()\n                if isinstance(communicated, tuple):\n                    if isinstance(communicated[0], str):\n                        communicated_stdout = communicated[0]\n                    if len(communicated) > 1 and isinstance(communicated[1], str):\n                        communicated_stderr = communicated[1]\n            except ValueError:\n                pass\n\n    if budget_checkpointed:\n'''
          if old not in s:
              raise SystemExit('expected communicate block not found')
          s=s.replace(old,new,1)
          old2='''    stdout = stdout_path.read_text(encoding="utf-8") if stdout_path.exists() else ""\n    stderr = stderr_path.read_text(encoding="utf-8") if stderr_path.exists() else ""\n'''
          new2='''    stdout = stdout_path.read_text(encoding="utf-8") if stdout_path.exists() else ""\n    stderr = stderr_path.read_text(encoding="utf-8") if stderr_path.exists() else ""\n    if not stdout.strip():\n        stdout = communicated_stdout\n    if not stderr.strip():\n        stderr = communicated_stderr\n'''
          if old2 not in s:
              raise SystemExit('expected output read block not found')
          p.write_text(s.replace(old2,new2,1))
          PY
          git config user.name 'Botstrader Automation V3'
          git config user.email 'automation-v3@users.noreply.github.com'
          git add automation_v3_remote_worker.py
          git diff --cached --check
          git commit -m 'Patch remote worker communicate fallback'
          git push origin HEAD:fix/automation-v3-discovery-convergence-performance
