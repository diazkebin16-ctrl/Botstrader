name: Reselect stored 60-day PAPER evidence
on:
  workflow_dispatch:
    inputs:
      replay_run_id:
        required: true
        default: '35123033435'
  push:
    branches: [codex/adaptive-60-day-release]
    paths:
      - .github/workflows/directional-reselect-60d.yml
      - directional_trend_optimizer.py
      - run_directional_trend_optimization.py
      - major_trend.py
      - test_directional_trend_optimizer.py
permissions:
  contents: write
  actions: read
concurrency:
  group: directional-reselect-60d
  cancel-in-progress: true
jobs:
  reselect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-research.txt pytest
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.replay_run_id || '35123033435' }}
          pattern: trend60-replay-*
          path: replay_evidence
          merge-multiple: true
      - name: Fit the same saved 60-day sample
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from major_trend import utc
          from run_directional_trend_optimization import aggregate
          root = Path('replay_evidence')
          window = json.loads((root/'EUR_USD_replay.json').read_text())['window']
          aggregate(root, utc(window['start']), utc(window['end']))
          PY
      - name: Save auditable evidence branch
        run: |
          git config user.name 'Botstrader PAPER Research'
          git config user.email 'research@users.noreply.github.com'
          git add replay_evidence
          git commit -m 'Record complete 60-day replay evidence and selection'
          git push origin "HEAD:refs/heads/research/adaptive-60d-review-${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reselected-60d-${{ github.run_id }}
          path: replay_evidence/DIRECTIONAL_TREND_60D_EVIDENCE.json
