name: Directional Adaptive 60-Day PAPER Research

on:
  workflow_dispatch:
  push:
    branches:
      - codex/adaptive-60-day-trends
    paths:
      - .github/workflows/directional-one-month-min10.yml
      - directional_trend_optimizer.py
      - run_directional_trend_optimization.py
      - test_directional_trend_optimizer.py
      - major_trend.py
      - historical_replay.py
      - historical_candles.py
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write

concurrency:
  group: directional-adaptive-60d
  cancel-in-progress: false

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      BOTS_V3_PRODUCTION_AUTHORITY: "false"
      BOTS_V3_RAILWAY_PROJECT_ID: c19fa79a-6284-4d9d-bddc-06a62c0f998b
      BOTS_V3_RAILWAY_ENVIRONMENT_ID: 3f0906f8-56a4-471f-9c19-cea4d0a82f20
      BOTS_V3_RAILWAY_SERVICE_ID: 06f23754-3652-4817-a119-2c9851408120
      TRADING_ENVIRONMENT: PAPER
      PRIMARY_OANDA_ENV: practice
      PRODUCTION_AUTHORIZED: "false"
      OANDA: https://api-fxpractice.oanda.com

    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure isolated output path
        run: echo "DIRECTIONAL_TREND_ROOT=$RUNNER_TEMP/directional_trend_60d" >> "$GITHUB_ENV"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-research.txt pytest
          npm install -g @railway/cli@5.23.3

      - name: Validate single-window optimizer
        run: python -m pytest -q test_directional_trend_optimizer.py

      - name: Import PAPER credentials securely
        run: python automation_v3_railway_adapter.py export-runtime

      - name: Run all ten PAPER strategies over one 60-day window
        run: python run_directional_trend_optimization.py

      - name: Record governed evidence
        shell: bash
        run: |
          cp "$DIRECTIONAL_TREND_ROOT/DIRECTIONAL_TREND_60D_EVIDENCE.json" DIRECTIONAL_TREND_60D_EVIDENCE.json
          git config user.name "Botstrader PAPER Research"
          git config user.email "research@users.noreply.github.com"
          git add DIRECTIONAL_TREND_60D_EVIDENCE.json
          git diff --cached --check
          git diff --cached --quiet || git commit -m "Record adaptive 60-day PAPER evidence"
          evidence_ref="research/adaptive-60d-${{ github.run_id }}"
          git push origin "HEAD:$evidence_ref"

      - name: Refresh qualified PAPER configuration on main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          from trend_paper_activation import activate_report
          source = Path(os.environ["DIRECTIONAL_TREND_ROOT"]) / "DIRECTIONAL_TREND_60D_EVIDENCE.json"
          report = json.loads(source.read_text())
          if report["all_ten_qualified"]:
              activate_report(source)
          else:
              print("All ten strategies did not qualify; active PAPER configuration retained.")
          PYCODE
          if [ -f ACTIVE_TREND_60D_PAPER.json ]; then
            git add ACTIVE_TREND_60D_PAPER.json
            if ! git diff --cached --quiet; then
              git fetch origin main
              current_main="$(git rev-parse origin/main)"
              if [ "$current_main" != "${{ github.sha }}" ]; then
                echo "Main changed during research; evidence saved, activation deferred."
                exit 0
              fi
              git commit -m "Refresh qualified adaptive 60-day PAPER strategies"
              git push origin HEAD:main
            fi
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-adaptive-60d-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/directional_trend_60d/DIRECTIONAL_TREND_60D_EVIDENCE.json
            ${{ runner.temp }}/directional_trend_60d/*_episodes.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish compact gate summary
        if: always()
        shell: bash
        run: |
          report="$DIRECTIONAL_TREND_ROOT/DIRECTIONAL_TREND_60D_EVIDENCE.json"
          if [ -f "$report" ]; then
            python - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print("## Adaptive 60-day PAPER gate")
          print(f"Approved: {report['approved_count']}/10")
          for item in report["results"]:
              metrics = item.get("metrics") or {}
              print(f"- {item['strategy_id']}: {item['verdict']} — resolved={metrics.get('resolved')} win_rate={metrics.get('win_rate')}")
          print("\nLIVE authority: disabled")
          PY
          fi
