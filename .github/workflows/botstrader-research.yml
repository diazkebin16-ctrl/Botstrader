name: BotsTrader Research Environment Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-environment-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Display environment
        run: |
          echo "Commit: $GITHUB_SHA"
          python --version
          uname -a
          pwd

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python sources
        run: |
          python -m compileall .

      - name: Run isolated pytest smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/botstrader_smoke"
          cat > "$RUNNER_TEMP/botstrader_smoke/test_environment.py" <<'PY'
          def test_research_environment():
              assert 2 + 2 == 4
          PY
          python -m pytest -q "$RUNNER_TEMP/botstrader_smoke/test_environment.py"

      - name: Create research manifest
        run: |
          mkdir -p research_output
          python - <<'PY'
          import json
          import os
          import platform

          manifest = {
              "purpose": "offline_research_environment_validation",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "python_version": platform.python_version(),
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "railway_access": False,
              "oanda_access": False,
              "trading_authority": False,
              "production_write_authority": False
          }

          with open("research_output/research_environment_manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          PY

      - name: Upload research validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: botstrader-research-environment-validation
          path: research_output/
          if-no-files-found: error
