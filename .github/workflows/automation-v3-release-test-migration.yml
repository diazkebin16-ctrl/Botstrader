name: Automation V3 Release Contract Test Migration
on:
  push:
    branches: [feature/automation-v3-remote-runner]
    paths:
      - patch_v3_release_contract_tests.py
      - .github/workflows/automation-v3-release-test-migration.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/automation-v3-remote-runner
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python patch_v3_release_contract_tests.py
      - run: |
          git diff --check
          python -m compileall -q test_automation_v3.py
      - run: |
          git config user.name "Botstrader Automation V3"
          git config user.email "automation-v3@users.noreply.github.com"
          git add test_automation_v3.py
          git commit -m "Update V3 release tests for managed candidate contract"
          git push origin HEAD:feature/automation-v3-remote-runner
