name: Temporary full review terminal validation

on:
  push:
    branches:
      - fix/automation-v3-review-terminal-report

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-research.txt
          pip install pytest pyflakes
      - name: Focused real terminal path
        run: python -m pytest -q test_automation_v3_modes.py test_automation_v3_remote_runner.py
      - name: Incumbent challenger tests
        run: python -m pytest -q test_automation_v3_incumbent_challenger.py
      - name: Existing V3 tests
        run: python -m pytest -q test_automation_v3.py test_research_governance.py
      - name: Full regression
        run: python -m pytest -q
      - name: Compileall
        run: python -m compileall -q .
      - name: Pyflakes changed Python files
        run: pyflakes automation_v3_modes.py automation_v3_remote_worker.py test_automation_v3_modes.py test_automation_v3_remote_runner.py
      - name: Git diff check
        run: git diff --check 54761a95b4c488cdc1711b5abb215c693caa69b2 HEAD
      - name: Protected files
        shell: bash
        run: test -z "$(git diff --name-only 54761a95b4c488cdc1711b5abb215c693caa69b2 HEAD -- server.py forward_experiment.py)"
      - name: Secret and dataset scan
        run: |
          python - <<'PY'
          import pathlib, re, subprocess
          changed = [pathlib.Path(x) for x in subprocess.check_output(['git','diff','--name-only','54761a95b4c488cdc1711b5abb215c693caa69b2','HEAD'], text=True).splitlines() if x.strip()]
          secret_assignment = re.compile(r"(?im)^\s*(?:OANDA_TOKEN|RAILWAY_TOKEN|API_KEY|SECRET_KEY|PASSWORD)\s*=\s*['\"]([^'\"]+)['\"]")
          placeholders = {'railway-secret','supersecret','x','y','g','r','o'}
          for path in changed:
              if not path.is_file():
                  continue
              if path.suffix.lower() in {'.db','.sqlite','.zip','.pyc'} or '__pycache__' in path.parts:
                  raise AssertionError(f'dataset/binary/transient committed: {path}')
              if path.suffix.lower() in {'.py','.yml','.yaml','.md'}:
                  text = path.read_text(encoding='utf-8')
                  for match in secret_assignment.finditer(text):
                      value = match.group(1)
                      if value not in placeholders and len(value) >= 8:
                          raise AssertionError(f'credential-like literal in {path}')
          PY
      - name: Remove temporary validation workflow
        run: |
          git config user.name "Botstrader Automation V3"
          git config user.email "automation-v3@users.noreply.github.com"
          rm -f .github/workflows/tmp-full-review-terminal-validation.yml
          git add .github/workflows/tmp-full-review-terminal-validation.yml
          git diff --cached --check
          git commit -m "Remove temporary review terminal validation"
          git push origin HEAD:fix/automation-v3-review-terminal-report
