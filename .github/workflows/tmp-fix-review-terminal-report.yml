name: Temporary Automation V3 review terminal-path patch

on:
  push:
    branches:
      - fix/automation-v3-review-terminal-report

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/tmp_fix_review_terminal_report.py
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-research.txt
          pip install pytest pyflakes
      - name: Focused real-path tests
        run: |
          python -m pytest -q test_automation_v3_modes.py test_automation_v3_remote_runner.py
      - name: Static checks
        run: |
          python -m compileall -q automation_v3_modes.py automation_v3_remote_worker.py test_automation_v3_modes.py test_automation_v3_remote_runner.py
          pyflakes automation_v3_modes.py automation_v3_remote_worker.py test_automation_v3_modes.py test_automation_v3_remote_runner.py
          git diff --check
      - name: Commit governed patch only
        run: |
          git config user.name "Botstrader Automation V3"
          git config user.email "automation-v3@users.noreply.github.com"
          rm -f .github/scripts/tmp_fix_review_terminal_report.py .github/workflows/tmp-fix-review-terminal-report.yml
          git add automation_v3_modes.py automation_v3_remote_worker.py test_automation_v3_modes.py test_automation_v3_remote_runner.py .github/scripts/tmp_fix_review_terminal_report.py .github/workflows/tmp-fix-review-terminal-report.yml
          git diff --cached --check
          git commit -m "Persist review diagnostics before scientific terminal"
          git push origin HEAD:fix/automation-v3-review-terminal-report
